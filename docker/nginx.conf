events {}
http {
    # Map /node/<port>/ requests to the correct Docker service.
    # Storage nodes are named storage-1..4 and listen on ports 5001..5004.
    map $request_uri $storage_upstream {
        ~^/node/5001/  "storage-1:5001";
        ~^/node/5002/  "storage-2:5002";
        ~^/node/5003/  "storage-3:5003";
        ~^/node/5004/  "storage-4:5004";
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Metadata server API (mirrors Vite /api proxy)
        location /api/ {
            proxy_pass http://metadata:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Storage-node proxy (mirrors Vite /node/<port> proxy)
        location ~ ^/node/(\d+)/(.*)$ {
            proxy_pass http://$storage_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SPA fallback — serve index.html for client-side routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}