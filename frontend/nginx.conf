events {}
http {
    # Standard MIME types — required so .js modules are served as
    # application/javascript (browsers enforce strict MIME checking).
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Metadata server API (mirrors Vite /api proxy)
        location /api/ {
            proxy_pass http://metadata:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Storage-node proxy ──────────────────────────────────────────
        # Each port gets its own location block pointing to the matching
        # Docker service name. This avoids any dynamic variable complexity.
        location /node/5001/ {
            proxy_pass http://storage-1:5001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /node/5002/ {
            proxy_pass http://storage-2:5002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /node/5003/ {
            proxy_pass http://storage-3:5003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /node/5004/ {
            proxy_pass http://storage-4:5004/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SPA fallback — serve index.html for client-side routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
